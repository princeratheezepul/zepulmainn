services:
  - type: web
    name: zepul-fullstack
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      # express@5 requires Node >=18; express-rate-limit@8 expects >=20.
      # Pin it so Render's default runtime can't silently break the build.
      - key: NODE_VERSION
        value: "20"
      # Declared (not valued) so the dashboard prompts for it and its absence is
      # visible in the blueprint. Without it every AI path — ZepPrep, resume
      # analysis, scorecards — fails at the "OpenAI is not configured" guard while
      # the service itself stays healthy, which is easy to miss.
      - key: OPENAI_API
        sync: false
